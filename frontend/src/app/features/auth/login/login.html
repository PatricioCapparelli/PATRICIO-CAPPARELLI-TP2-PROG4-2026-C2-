<div class="auth-wrapper">
  <div class="card">
    <h2>Iniciar sesión</h2>
    <p class="subtitulo">Ingresá con tu correo o nombre de usuario.</p>

    <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
      <div class="campo">
        <label for="identificador">Correo o nombre de usuario</label>
        <input id="identificador" formControlName="identificador" [class.con-error]="invalido(f.identificador)" />
        <app-error-campo [control]="f.identificador" />
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" [class.con-error]="invalido(f.password)" />
        <app-error-campo [control]="f.password" />
      </div>

      <button class="btn btn-primario btn-block" type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="pie-form">¿No tenés cuenta? <a routerLink="/registro">Registrate</a></p>
  </div>
</div>
