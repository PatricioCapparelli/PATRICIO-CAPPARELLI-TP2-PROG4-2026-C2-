<nav class="navbar">
  <a class="marca" routerLink="/">Remember!</a>
  <div class="menu">
    @if (auth.logueado()) {
    <a routerLink="/publicaciones" routerLinkActive="active">Publicaciones</a>
    <img routerLink="/mi-perfil" routerLinkActive="active" [src]="auth.usuario()?.imagenPerfil"
      [alt]="auth.usuario()?.nombre" class="avatar-mini" />
    <button type="button" class="btn btn-salir" (click)="pedirCerrarSesion()">
      Salir
    </button>
    } @else {
    <a routerLink="/login" routerLinkActive="active">Ingresar</a>
    <a routerLink="/registro" routerLinkActive="active">Registrarse</a>
    }
  </div>
</nav>
